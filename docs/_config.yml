title: airCFO · QBO Gateway
description: Talk to your QuickBooks in plain English — a secure, read-only QuickBooks connector for Claude, built by airCFO.

# The site is served at https://aircfo.github.io/qbo-mcp/ (a GitHub Pages project
# site). These two keys make asset paths and internal links resolve under that
# subpath. If you later attach a custom domain (a CNAME file), set baseurl to "".
url: "https://aircfo.github.io"
baseurl: "/qbo-mcp"

# The site uses the shared airCFO-branded layout and stylesheet (mirrored from
# the claude-startup-finance docs site) instead of a gem theme.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Let [text](other-page.md) links between docs resolve to their published URLs.
plugins:
  - jekyll-relative-links
